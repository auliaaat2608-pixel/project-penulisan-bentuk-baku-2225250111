
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3eaff">
    <title>MathLearn - Belajar Matematika</title>

    <link rel="stylesheet" href="src/styles/style.css">
</head>
<body>

    <div id="app">
        <main class="welcome-container">
            <div class="mascot">🧮</div>

            <h1>MathLearn</h1>

            <p class="subtitle">
                Belajar Matematika Jadi Lebih Seru!
            </p>

            <section class="welcome-card">
                <h2>Halo, Pelajar Hebat! 👋</h2>

                <p>
                    Selamat datang di MathLearn.
                    Yuk, belajar bentuk baku dengan cara
                    yang menyenangkan!
                </p>

                <label for="nickname">Masukkan nama panggilanmu</label>

                <input
                    type="text"
                    id="nickname"
                    placeholder="Contoh: Aulia"
                    autocomplete="given-name"
                >

                <button id="start-button" type="button">
                    Mulai Belajar
                </button>
            </section>

            <p class="footer-text">
                MathLearn © 2026
            </p>
        </main>
    <div id="app">
    <!-- Halaman MathLearn -->
</div>

<script src="src/scripts/app.js"></script>
</body>
</html>
